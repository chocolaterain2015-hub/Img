name: Compress images

on:
  workflow_dispatch:

jobs:
  compress:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y webp imagemagick

      - name: Compress images to WebP
        run: |
          set -e
          mkdir -p Img
          for f in $(find Img -maxdepth 1 -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' \)); do
            base=$(basename "$f")
            name="${base%.*}"
            out="Img/${name}-compressed.webp"
            echo "Processing $f -> $out"
            convert "$f" -auto-orient -strip -quality 85 -resize '1600x>' /tmp/tmp_input.jpg || cp "$f" /tmp/tmp_input.jpg
            q=75
            cwebp -q $q /tmp/tmp_input.jpg -o "$out"
            size=$(stat -c%s "$out")
            while [ $size -gt 512000 ] && [ $q -ge 30 ]; do
              q=$((q-5))
              echo "Reducing quality to $q"
              cwebp -q $q /tmp/tmp_input.jpg -o "$out"
              size=$(stat -c%s "$out")
            done
            echo "Final size for $out: $size bytes"
          done

      - name: Commit and push compressed images
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --force Img/*-compressed.webp || true
          if git diff --staged --quiet; then
            echo "No compressed files to commit"
          else
            git commit -m "Add compressed WebP images (generated by workflow)"
            git push "https://${GITHUB_ACTOR}:${GITHUB_TOKEN}@github.com/${{ github.repository }}" HEAD:$(git rev-parse --abbrev-ref HEAD)
          fi
